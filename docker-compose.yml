services:
  qoder-proxy:
    # 本地源码构建（已加入出站代理池）；官方预构建镜像不含本次补丁。
    # 升级上游版本：重新 `docker compose build --pull && docker compose up -d`
    image: qoder2api-hub:proxy-pool
    build:
      context: .
    container_name: qoder-proxy
    restart: unless-stopped
    ports:
      # 宿主机:容器。监听 0.0.0.0:37006（对外网卡）
      - "0.0.0.0:37006:37006"
    environment:
      # 监听参数真实生效：argparse 直接读 HOST/PORT
      - HOST=0.0.0.0
      - PORT=37006
      # API Key（OpenAI 兼容客户端用）；面板里配置的 Key 优先。
      # 留空时 --lan 会首次自动生成并持久化到 accounts/settings.json。
      # 不要把真实 Key 写进本文件：用 shell 环境变量或同目录 .env 传入。
      - API_KEY=${API_KEY:-}
      - TZ=Asia/Shanghai
    volumes:
      # 持久化账号凭证、面板设置与请求流水
      - ./accounts:/app/accounts
      - ./usage:/app/usage
    # --lan：监听全网卡并强制 API Key；--panel-password：Web 看板访问密码
    command:
      - python
      - qoder_proxy.py
      - --lan
      - --host
      - 0.0.0.0
      - --port
      - "37006"
      - --panel-password
      - "${PANEL_PASSWORD:-admin}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/ping' % os.environ.get('PORT','37006'),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
