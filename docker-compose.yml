services:
  qoder-proxy:
    # 使用本 fork 自动构建的镜像：每次 push main 后 GitHub Actions 推送
    # ghcr.io/qingdeng888/qoder2api-hub:latest。
    # 拉取：docker compose pull && docker compose up -d
    # 想改成本地源码构建：注释 image，取消 build 的注释。
    image: ghcr.io/qingdeng888/qoder2api-hub:latest
    # build:
    #   context: .
    container_name: qoder-proxy
    restart: unless-stopped
    # 固定网卡 MAC（**可选，默认关闭**）：bridge 网络下容器停止会重建 veth，设备身份随之变化。
    # 但 v1.2.13 起网关默认启用「机器身份落盘缓存」：只要 accounts/ 是挂载卷，
    # **重启 / 重建 / 升级都不会再换设备身份** —— 所以通常**不需要**这一行。
    # 只在「不挂载 accounts/」或「希望组件调用本身也稳定」时才需要固定它。
    # ⚠️ 要用的话请换成你自己生成的，别照抄——macvlan / 同一宿主机多实例会撞 MAC：
    #    printf '02:42:%02x:%02x:%02x:%02x\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256))
    # mac_address: "02:42:ac:11:00:77"
    # 固定主机名（**可选**）：签到请求的 Cosy-MachineHostname 与官方桌面端一样取本机
    # hostname，容器默认是容器 ID，每次重建都会变。想固定就填一个**你自己的**名字，
    # 别照抄示例（所有人用同一个名字反而成了共同指纹）。
    # hostname: my-nas
    ports:
      # 宿主机:容器。监听 0.0.0.0:37006（对外网卡）
      - "0.0.0.0:37006:37006"
    environment:
      # 监听参数真实生效：argparse 直接读 HOST/PORT
      - HOST=0.0.0.0
      - PORT=37006
      # API Key（OpenAI 兼容客户端用）；面板里配置的 Key 优先。
      # 留空时 --lan 会首次自动生成并持久化到 accounts/settings.json。
      # 不要把真实 Key 写进本文件：用 shell 环境变量或同目录 .env 传入。
      - API_KEY=${API_KEY:-}
      - TZ=Asia/Shanghai
    volumes:
      # 持久化账号凭证、面板设置与请求流水
      - ./accounts:/app/accounts
      - ./usage:/app/usage
    # --lan：监听全网卡并强制 API Key；--panel-password：Web 看板访问密码
    command:
      - python
      - qoder_proxy.py
      - --lan
      - --host
      - 0.0.0.0
      - --port
      - "37006"
      - --panel-password
      - "${PANEL_PASSWORD:-admin}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/ping' % os.environ.get('PORT','37006'),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
